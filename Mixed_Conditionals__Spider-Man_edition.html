<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mixed Conditionals: Spider-Man edition</title>
<style>
:root{--bg:#f6f3ff;--card:#fff;--tx:#1d1b2e;--mu:#6b6788;--ac:#d6262f;--ac2:#2a4bd7;--ok:#1f9d55;--okb:#dff5e8;--bad:#d6262f;--badb:#fde3e3;--bd:#e0dcf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#1e1b3a;--tx:#f0eeff;--mu:#a19cc8;--okb:#133a28;--badb:#4a1d22;--bd:#35305f}}
:root[data-theme="dark"]{--bg:#14122a;--card:#1e1b3a;--tx:#f0eeff;--mu:#a19cc8;--okb:#133a28;--badb:#4a1d22;--bd:#35305f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:0 auto}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
header h1{margin:0;font-size:21px}header p{margin:4px 0 0;font-size:14px;opacity:.9}
#prog{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 4px;display:flex;justify-content:space-between}
.hint{color:var(--mu);font-size:14px;margin:0 0 10px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
button:active{transform:scale(.97)}
button.ok{background:var(--okb);border-color:var(--ok)}button.bad{background:var(--badb);border-color:var(--bad)}
button.sel{border-color:var(--ac2);background:var(--bg);box-shadow:0 0 0 2px var(--ac2)}
button:disabled{opacity:.75;cursor:default}
.main{background:var(--ac2);color:#fff;border-color:var(--ac2);text-align:center}
.q{margin:10px 0 6px;font-weight:600}.opts{display:flex;flex-wrap:wrap;gap:6px}
.flips{display:grid;gap:8px}.flip{min-height:84px;width:100%}
.flip b{display:block;margin-bottom:4px}.flip.on{background:var(--okb);border-color:var(--ok)}
.row{margin:8px 0;padding:8px;border:1px solid var(--bd);border-radius:12px}.row.ok{background:var(--okb)}.row.bad{background:var(--badb)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.two>div{display:flex;flex-direction:column;gap:6px}
.built{min-height:48px;border:2px dashed var(--bd);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pool{display:flex;flex-wrap:wrap;gap:6px}.tok{padding:6px 10px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:4px 8px;width:9.5em;max-width:100%}
input.ok{border-color:var(--ok);background:var(--okb)}input.bad{border-color:var(--bad);background:var(--badb)}
.fb{margin-top:8px;font-weight:600}.boss{text-align:center}.hud{font-size:22px;letter-spacing:2px}
.sq{min-height:96px;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center}.formula{background:var(--bg);border-radius:10px;padding:6px 8px;margin-top:6px;font-size:14px}
</style></head><body>
<header><h1>🕷️ Mixed Conditionals: Spider-Man edition</h1>
<p>B2 · Peter, MJ, Aunt May, Harry и Gwen ждут твоих ответов</p><span id="prog">0/8</span></header>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),done=new Set();
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function fin(n){done.add(n);$('#d'+n).textContent='✅';$('#prog').textContent=done.size+'/8'+(done.size==8?' 🏆':'')}
const T=[
["🃏 Карточки: два типа","👆 Нажимай на карточки, чтобы увидеть правило."],
["🎯 Выбери форму","👆 Нажми на правильный вариант."],
["🧩 Соедини половинки","👆 Нажми на начало предложения, затем на его окончание."],
["🧱 Собери предложение","👆 Под русской подсказкой собери английское предложение. Нажми на слово в рамке, чтобы убрать его."],
["✍️ Впиши глаголы","⌨️ Поставь глаголы в скобках в нужную форму."],
["🔤 Квадраты: RU → EN","👆 Нажми на русский квадрат, затем на его английский перевод."],["🕷️ Spider-sense: найди ошибку","🔎 Нажми на часть предложения с ошибкой, и она исправится."],["🔥 Final boss: Green Goblin","Ответь верно и сними 5 HP с Гоблина. У тебя 3 сердца."]];
const app=$('#app');
T.forEach((t,i)=>{const s=el('section','card');s.innerHTML=`<h2><span>${i+1}. ${t[0]}</span><span id="d${i+1}"></span></h2><p class="hint">${t[1]}</p><div id="b${i+1}"></div>`;app.append(s)});

// 1 flip cards
(()=>{const b=$('#b1'),w=el('div','flips');b.append(w);let seen=new Set();
[["🕰️➡️⏰ Тип 1: прошлое → сейчас","If + Past Perfect, would + V1","<b>Когда использовать:</b> в прошлом что-то случилось (или не случилось), и из-за этого сейчас такой результат.<br>🧠 Проще: «Если бы тогда…, то сейчас…»<br>Маркеры: now, today, these days.<br><br>• If Peter had prepared the contracts, he would be signing deals now.<br><i>Если бы Питер подготовил контракты, он бы сейчас подписывал сделки.</i><br>• If Harry had slept more, he wouldn’t be so grumpy today.<br><i>Если бы Гарри выспался, он бы сегодня не был таким раздражённым.</i>"],
["♾️➡️🕰️ Тип 2: всегда → прошлое","If + Past Simple, would have + V3","<b>Когда использовать:</b> условие — это постоянная черта, характер или состояние («вообще»), а результат — конкретный случай в прошлом.<br>🧠 Проще: «Если бы он/она вообще был(а) такой…, то тогда бы…»<br>Маркеры: in general, yesterday, last year.<br>После if глагол to be — were для всех лиц (I / he / she were).<br><br>• If MJ were less busy, she would have seen the sights last September.<br><i>Если бы MJ была менее занята, она бы осмотрела достопримечательности в прошлом сентябре.</i><br>• If Peter were more organised, he wouldn’t have missed the meeting yesterday.<br><i>Если бы Питер был организованнее, он бы не пропустил вчерашнюю встречу.</i>"],
["⚠️ Ловушки","’d = had или would?","If I’d known, I’d be there. Первое ’d = had, второе = would.<br><i>Если бы я знал, я был бы там.</i><br>После if нельзя ставить would: ✗ If Peter would be careful."]]
.forEach((c,i)=>{const f=el('button','flip',`<b>${c[0]}</b>${c[1]}`);f.onclick=()=>{f.classList.add('on');f.innerHTML=`<b>${c[1]}</b>${c[2]}`;seen.add(i);if(seen.size==3)fin(1)};w.append(f)})})();

/* sort removed
(()=>{const b=$('#b2');let n=0;const L=[["If Peter had listened to Aunt May, he wouldn’t be so tired now.",0],["If Gwen weren’t so stubborn, she would have apologised to Harry yesterday.",1],["If Harry hadn’t signed that contract, he wouldn’t be in debt now.",0],["If Aunt May were more easy-going, she wouldn’t have got lost.",1],["If MJ had taken the job in Chicago, she would live there now.",0],["If Peter’s son weren’t so curious, he wouldn’t have followed the spider last night.",1]];
L.forEach(([s,a])=>{const r=el('div','row',`<div>${s}</div>`),g=el('div','two');
[["⏪ Past → Now",0],["♾️ Always → Past",1]].forEach(([t,v])=>{const k=el('button','',t);k.onclick=()=>{if(v==a){r.classList.add('ok');g.querySelectorAll('button').forEach(x=>x.disabled=true);k.classList.add('ok');if(++n==L.length)fin(2)}else{k.classList.add('bad');k.disabled=true}};g.append(k)});r.append(g);b.append(r)})})(); */

const em=s=>{const m=[['Peter','🕷️'],['MJ','💃'],['Harry','🎃'],['Gwen','🎸'],['Aunt','👵'],['kids','👧'],['son','👦'],['photos','📸'],['vacuum','🤖'],['Chicago','🌆'],['milk','🥛'],['glider','🛩️'],['contract','📝'],['homework','📚'],['beach','🏖️']];const e=m.filter(x=>s.includes(x[0])).slice(0,3).map(x=>x[1]).join('');return (e?e+' ':'')+s};
function mcq(box,items,cb){let n=0;items.forEach(it=>{const q=el('div','q',em(it.q)),o=el('div','opts');
sh(it.o).forEach(t=>{const k=el('button','',t);k.onclick=()=>{if(t==it.o[0]){k.classList.add('ok');o.querySelectorAll('button').forEach(x=>x.disabled=true);if(++n==items.length)cb()}else{k.classList.add('bad');k.disabled=true}};o.append(k)});box.append(q,o)})}
mcq($('#b2'),[
{q:"If Peter had checked the photos, he ___ the deals now.",o:["would be signing","would have signed","will sign"]},
{q:"If MJ weren’t so busy with the kids, she ___ the beach tour last September.",o:["wouldn’t have missed","wouldn’t miss","hadn’t missed"]},
{q:"If Harry ___ more careful, he wouldn’t have crashed the glider yesterday.",o:["were","had been","would be"]},
{q:"If little May ___ her homework yesterday, she wouldn’t be grounded now.",o:["had done","did","would do"]},
{q:"If Gwen hadn’t worked all night, she ___ so tired today.",o:["wouldn’t be","wouldn’t have been","won’t be"]}],()=>fin(2));

// 4 match
(()=>{const b=$('#b3'),P=[["If Peter weren’t so forgetful,","he wouldn’t have lost the robot vacuum."],["If Harry had listened to Gwen,","he wouldn’t be in trouble now."],["If Aunt May had checked the map,","she would be home with the milk now."],["If MJ were more relaxed,","she would have enjoyed the whole trip."]];
const g=el('div','two'),l=el('div'),r=el('div');g.append(l,r);b.append(g);let sel=null,n=0;
P.forEach((p,i)=>{const k=el('button','',p[0]);k.dataset.i=i;l.append(k);k.onclick=()=>{if(k.disabled)return;l.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));k.classList.add('sel');sel=k}});
sh(P.map((p,i)=>[p[1],i])).forEach(([t,i])=>{const k=el('button','',t);r.append(k);k.onclick=()=>{if(!sel||k.disabled)return;if(sel.dataset.i==i){sel.classList.remove('sel');sel.classList.add('ok');k.classList.add('ok');sel.disabled=k.disabled=true;sel=null;if(++n==P.length)fin(3)}else{k.classList.add('bad');setTimeout(()=>k.classList.remove('bad'),500)}}})})();

// 5 word order
(()=>{const b=$('#b4');let n=0;[["If Peter had trained harder, he would be stronger now.","Если бы Питер тренировался усерднее, он был бы сейчас сильнее. 💪"],["If Harry were braver, he would have told Gwen the truth.","Если бы Гарри был смелее, он бы рассказал Гвен правду. 💬"],["If the kids hadn’t stayed up late, they wouldn’t be sleepy now.","Если бы дети не засиделись допоздна, они бы сейчас не хотели спать. 😴"]].forEach(([s,ru])=>{
const w=el('div','row',`<div class="q">🇷🇺 ${ru}</div>`),bt=el('div','built'),pl=el('div','pool'),ok=el('button','main','Проверить'),fb=el('div','fb');
sh(s.split(' ')).forEach(t=>{const k=el('button','tok',t);k.onclick=()=>{if(k.parentNode==pl){bt.append(k)}else{pl.append(k)}};pl.append(k)});
ok.onclick=()=>{if(w.classList.contains('ok'))return;const got=[...bt.children].map(x=>x.textContent).join(' ');if(got==s){w.classList.add('ok');fb.textContent='🕸️ Верно!';if(++n==3)fin(4)}else{w.classList.add('bad');fb.textContent='Пока не так, попробуй ещё.';setTimeout(()=>w.classList.remove('bad'),700)}};
w.append(bt,pl,ok,fb);b.append(w)})})();

// 6 typing
(()=>{const b=$('#b5'),norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().replace(/^were not$/,"weren't");
const L=[["If MJ __ (be) less busy in general, she __ (visit) all the sights last September.",[["were"],["would have visited"]]],
["If Peter __ (prepare) the contracts beforehand, he __ (sign) deals now.",[["had prepared"],["would be signing","would sign"]]],
["If Harry __ (not be) so proud, he __ (apologise) to Peter yesterday.",[["weren't","were not"],["would have apologised","would have apologized"]]],
["If Gwen __ (take) the earlier train, she __ (be) at the lab now.",[["had taken"],["would be"]]]];
const ins=[];L.forEach(([s,a])=>{const r=el('div','row'),p=em(s).split('__');p.forEach((t,i)=>{r.append(document.createTextNode(t));if(i<a.length){const x=el('input');x.autocapitalize='off';x.setAttribute('autocomplete','off');x.dataset.a=JSON.stringify(a[i]);ins.push(x);r.append(x)}});b.append(r)});
const k=el('button','main','Проверить'),fb=el('div','fb');k.onclick=()=>{let all=1;ins.forEach(x=>{const ok=JSON.parse(x.dataset.a).some(v=>norm(v)==norm(x.value));x.className=ok?'ok':'bad';if(!ok)all=0});fb.textContent=all?'🕷️ Все верно!':'Красным отмечены ошибки.';if(all)fin(5)};b.append(k,fb)})();

// 6 squares
(()=>{const b=$('#b6'),P=[["Если бы Питер был внимательнее, он бы не потерял пылесос. 🤖","If Peter were more careful, he wouldn’t have lost the vacuum."],["Если бы Гарри послушал Гвен, он бы сейчас не был в долгах. 💸","If Harry had listened to Gwen, he wouldn’t be in debt now."],["Если бы MJ была спокойнее, она бы насладилась поездкой. 🌆","If MJ were calmer, she would have enjoyed the trip."],["Если бы дети легли вовремя, они бы сейчас не зевали. 😴","If the kids had gone to bed on time, they wouldn’t be yawning now."],["Если бы тётя Мэй была организованнее, она бы не заблудилась по дороге за молоком. 🥛","If Aunt May were more organised, she wouldn’t have got lost on the milk run."]];
const g=el('div');g.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';b.append(g);let sel=null,n=0;
sh(P.flatMap((p,i)=>[[p[0],i,1],[p[1],i,0]])).forEach(([t,i,ru])=>{const k=el('button','sq',t);k.dataset.i=i;if(ru)k.style.borderColor='var(--ac2)';g.append(k);k.onclick=()=>{if(k.disabled)return;if(!sel){sel=k;k.classList.add('sel');return}if(sel==k){k.classList.remove('sel');sel=null;return}const a=sel;sel=null;a.classList.remove('sel');if(a.dataset.i==k.dataset.i){a.classList.add('ok');k.classList.add('ok');a.disabled=k.disabled=true;if(++n==P.length)fin(6)}else{a.classList.add('bad');k.classList.add('bad');setTimeout(()=>{a.classList.remove('bad');k.classList.remove('bad')},600)}}})})();

// 7 spot the error
(()=>{const b=$('#b7');let n=0;[["If Peter|were|more organised in general,|he|would avoid|the queues in Chicago last time.",4,"would have avoided"],["If Harry|didn’t sign|that contract last year,|he|wouldn’t be|in debt now.",1,"hadn’t signed"],["If MJ|had been|less busy in general,|she|would have enjoyed|the beach tour last September.",1,"were"],["If Aunt May|would be|more easy-going in general,|she|would have planned|the route in advance.",1,"were"],["If the kids|hadn’t stayed up late|last night,|they|wouldn’t have been|sleepy now.",4,"wouldn’t be"]].forEach(([s,e,f])=>{const r=el('div','row'),p=el('div','pool');s.split('|').forEach((c,i)=>{const k=el('button','tok',c);k.onclick=()=>{if(r.classList.contains('ok'))return;if(i==e){k.className='tok ok';k.textContent='✅ '+f;r.classList.add('ok');if(++n==5)fin(7)}else{k.classList.add('bad');setTimeout(()=>k.classList.remove('bad'),600)}};p.append(k)});r.append(el('div','q','🕵️ '+(em(s).split(' ')[0].length<5&&em(s)!=s?em(s).split(' ')[0]:'')),p);b.append(r)})})();

// 8 boss
(()=>{const b=$('#b8'),Q=[
["If Peter’s son ___ so curious in general, he ___ the web-shooter last night.",["weren’t / wouldn’t have touched","hadn’t been / wouldn’t touch","isn’t / won’t have touched"]],
["If Harry ___ Gwen’s advice a month ago, his company ___ in trouble now.",["had taken / wouldn’t be","took / wouldn’t have been","had taken / wouldn’t have been"]],
["If Aunt May ___ more easy-going in general, she ___ so stressed at the shop yesterday.",["were / wouldn’t have been","had been / wouldn’t be","would be / wouldn’t have been"]],
["If MJ ___ the Chicago offer two years ago, the family ___ in New York now.",["had accepted / wouldn’t live","accepted / wouldn’t have lived","would accept / wouldn’t live"]],
["If Peter ___ better at planning in general, he ___ the Daily Bugle meeting last week.",["were / wouldn’t have missed","had been / wouldn’t miss","was / wouldn’t miss"]]];
let i,hp,hr;const w=el('div','boss');b.append(w);
function start(){i=0;hp=5;hr=3;show()}
function show(){const hud=`<div class="hud">👹 ${'🟥'.repeat(hp)}${'⬜'.repeat(5-hp)}<br>🕷️ ${'❤️'.repeat(hr)}${'🖤'.repeat(3-hr)}</div>`;w.innerHTML=hud;
if(hr==0){w.append(el('p','fb','Гоблин победил этот раунд 💥'));const k=el('button','main','Ещё раз');k.onclick=start;w.append(k);return}
if(hp==0){w.append(el('p','fb','Green Goblin повержен! 🏆'));fin(8);return}
const q=Q[i],qq=el('div','q',em(q[0])),o=el('div','opts');o.style.justifyContent='center';
sh(q[1]).forEach(t=>{const k=el('button','',t);k.onclick=()=>{if(t==q[1][0]){hp--;i++;show()}else{hr--;if(hr==0)show();else{k.classList.add('bad');k.disabled=true;w.querySelector('.hud').innerHTML=`👹 ${'🟥'.repeat(hp)}${'⬜'.repeat(5-hp)}<br>🕷️ ${'❤️'.repeat(hr)}${'🖤'.repeat(3-hr)}`}}};o.append(k)});w.append(qq,o)}
start()})();
</script></body></html>
